# Builds the Windows installer and publishes it as a GitHub release whenever a version tag is pushed.
# The app's auto-updater reads these releases (latest.yml + the installer) and offers the update in-app.
#
# To ship an update:  bump "version" in veil/package.json, commit, then
#   git tag v0.2.1 && git push && git push --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: veil
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veil/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # electron-builder uploads files in parallel; if the release doesn't exist yet each upload creates
      # its own and the files end up split across two releases. Creating it first avoids that.
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release view "$env:GITHUB_REF_NAME" *> $null; if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --title "$($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "" }; exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        run: npx electron-vite build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
